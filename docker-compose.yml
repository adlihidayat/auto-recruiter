services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autorecruiter
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d autorecruiter"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP port
    environment:
      MP_MAX_MESSAGES: 5000
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080" # Web Database GUI
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/autorecruiter
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@autorecruiter.local
      SECRET_KEY: super-secret-local-key
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      mailpit:
        condition: service_started
      agents:
        condition: service_started
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
    container_name: agents
    ports:
      - "8001:8001"
    environment:
      LANGSMITH_TRACING: "false"
    restart: unless-stopped

  realtime-worker:
    build:
      context: .
      dockerfile: apps/realtime-worker/Dockerfile
    container_name: realtime-worker
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
      - livekit
    restart: unless-stopped

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
      NEXT_PUBLIC_ENABLE_LIVEKIT_WS: "true"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
