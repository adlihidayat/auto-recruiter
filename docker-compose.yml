services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auto_recruiter_db
    ports:
      - "5433:5432"
    volumes:
      - auto_recruiter_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d auto_recruiter_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080" # Web Database GUI
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/auto_recruiter_db

      SECRET_KEY: super-secret-local-key
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      AGENTS_SERVICE_URL: http://agents:8001
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started

      agents:
        condition: service_started
    restart: unless-stopped

  agents:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
    container_name: agents
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      ONNX_INJECTION_MODEL_DIR: /app/assets/onnx_model
    restart: unless-stopped

  realtime-worker:
    build:
      context: .
      dockerfile: apps/realtime-worker/Dockerfile
    container_name: realtime-worker
    env_file: .env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
      - livekit
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
      NEXT_PUBLIC_ENABLE_LIVEKIT_WS: "true"
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_SERVER_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  auto_recruiter_db_data:
